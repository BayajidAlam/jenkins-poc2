name: jenkins-poc2

# =====================================================================================
# This stack runs the Jenkins controller AND two persistent agents:
#   - jenkins         : the Jenkins controller (UI on :8080, JNLP on :50000)
#   - agent-build     : persistent agent labelled "build" - runs Checkout + Build
#   - agent-push      : persistent agent labelled "push"  - runs Push to Docker Hub
#
# All three services are long-running. The agents are registered to the controller
# on first boot using the JNLP startup logic baked into the `jenkins/inbound-agent`
# image (see Dockerfile.agent).
#
# The agents share the host's Docker engine through /var/run/docker.sock
# (Docker-out-of-Docker pattern), so `docker build` / `docker push` inside an
# agent actually execute on the host daemon.
#
# To start the stack:
#     docker compose up -d
# =====================================================================================

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "8080:8080"    # Web UI
      - "50000:50000"  # JNLP - agents dial back to the controller on this port
    volumes:
      # Named volume - survives container restarts. All Jenkins config,
      # jobs, credentials, plugins, and build history live here.
      - jenkins_home:/var/jenkins_home

      # Bind-mount the host Docker socket so agents can run docker build/push.
      # We mount it on the controller too so the controller can manage agent
      # containers (inspect, logs) via the same socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net
    environment:
      - JENKINS_OPTS=--httpPort=8080

  # ---------------------------------------------------------------------------
  # agent-build : persistent agent, label "build"
  # Runs the Checkout + Build stages. Has docker CLI for `docker build`.
  # Always-on (restart: unless-stopped) so Jenkins doesn't pay container
  # spin-up cost per build.
  # ---------------------------------------------------------------------------
  agent-build:
    image: jenkins-agent-with-docker:latest-jdk17
    container_name: jenkins-agent-build
    restart: unless-stopped
    user: jenkins
    # Build args come from environment (set under `environment:` below) so
    # the agent can dial back to the controller on first boot.
    environment:
      - JENKINS_URL=http://jenkins-controller:8080
      - JENKINS_SECRET=${JENKINS_AGENT_BUILD_SECRET:?set JENKINS_AGENT_BUILD_SECRET in .env or compose env}
      - JENKINS_AGENT_NAME=agent-build
      - JENKINS_AGENT_LABELS=build docker
      - JENKINS_WEB_SOCKET=true
    volumes:
      # Mount the host Docker socket so this agent can run `docker build`
      # against the host daemon (DooD). The image built here is then pushed
      # by agent-push in the next stage.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net
    depends_on:
      - jenkins

  # ---------------------------------------------------------------------------
  # agent-push : persistent agent, label "push"
  # Runs the Push to Docker Hub stage. Has docker CLI for `docker login`
  # and `docker push`. Always-on.
  # ---------------------------------------------------------------------------
  agent-push:
    image: jenkins-agent-with-docker:latest-jdk17
    container_name: jenkins-agent-push
    restart: unless-stopped
    user: jenkins
    environment:
      - JENKINS_URL=http://jenkins-controller:8080
      - JENKINS_SECRET=${JENKINS_AGENT_PUSH_SECRET:?set JENKINS_AGENT_PUSH_SECRET in .env or compose env}
      - JENKINS_AGENT_NAME=agent-push
      - JENKINS_AGENT_LABELS=push docker
      - JENKINS_WEB_SOCKET=true
    volumes:
      # Same DooD socket mount - agent-push needs the docker CLI to push
      # the image that agent-build produced.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net
    depends_on:
      - jenkins

networks:
  jenkins_net:
    name: jenkins_net
    driver: bridge

volumes:
  jenkins_home:
    name: jenkins_home
